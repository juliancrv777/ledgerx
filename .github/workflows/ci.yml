name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ledgerx:ledgerx@localhost:5432/ledgerx
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  financial-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerx
          POSTGRES_PASSWORD: ledgerx
          POSTGRES_DB: ledgerx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ledgerx:ledgerx@127.0.0.1:5432/ledgerx?schema=public
      JWT_SECRET: ci-only-secret
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prisma:generate
      - run: npm run prisma:deploy -w @ledgerx/api
      - run: npm run test:e2e
